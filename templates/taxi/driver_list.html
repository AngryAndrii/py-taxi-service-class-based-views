{% extends "base.html" %}

{% block content %}
  <h1>Drivers list</h1>
  <table>
    <tr>
      <th>Id</th>
      <th>License number</th>
    </tr>
    {% for driver in drivers %}
      <tr>
        <td><a href="{% url "taxi:driver-detail" driver.id %}">{{ driver.first_name }} {{ driver.last_name }}</a></td>
        <td>{{ driver.license_number }}</td>
      </tr>
    {% endfor %}
  </table>

{% endblock %}
